<style>
/* Opzet: foto over de volle breedte met titel en teller linksboven over het donkere bladerdek; het stel blijft zichtbaar eronder. Daarna twee rustige secties: cijfers en mijlpalen. */
:root {
  --bg: #EDF0EB;
  --fg: #17251D;
  --hero-fg: #F8F6F0;
  --hero-muted: rgba(248, 246, 240, 0.82);
  --hero-gold: #EBCB93;
  --hero-teal: #86D8CC;
  --glass: rgba(8, 18, 12, 0.32);
  --font-display: 'Instrument Serif', Georgia, 'Times New Roman', serif;
  --font-body: 'Manrope', system-ui, -apple-system, 'Segoe UI', sans-serif;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: #000;
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

html { background: #000; }
.wrap {
  max-width: 1200px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* ---------- Hero ---------- */
.hero {
  position: relative;
  height: clamp(600px, max(100svh, 58vw), 1100px);
  overflow: hidden;
  color: var(--hero-fg);
  background: #000;
}
.photo, .couple {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  max-width: none;
  object-fit: cover;
  object-position: 60% 82%;
  transform-origin: 60% 80%;
  animation: drift 48s ease-in-out infinite alternate;
}
.couple { z-index: 3; pointer-events: none; }
@keyframes drift { from { transform: scale(1); } to { transform: scale(1.05); } }
.shade {
  position: absolute;
  inset: 0;
  background:
    linear-gradient(180deg, rgba(6, 16, 10, 0.7) 0%, rgba(6, 16, 10, 0.42) 34%, rgba(6, 16, 10, 0) 60%),
    linear-gradient(90deg, rgba(6, 16, 10, 0.36), rgba(6, 16, 10, 0) 56%);
}
#motes { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }

.hero-inner {
  position: relative;
  z-index: 2;
  padding-top: calc(env(safe-area-inset-top, 0px) + clamp(1.4rem, 4.2vw, 2.4rem));
}

.title-block { margin-top: 0; text-align: center; }
h1 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 400;
  font-size: clamp(4.95rem, 15.75vw, 12.3rem);
  line-height: 0.92;
  letter-spacing: -0.01em;
  text-shadow: 0 2px 24px rgba(0, 0, 0, 0.35);
}
.hero { --accent: var(--hero-teal); }
.hero[data-view="married"] { --accent: var(--hero-gold); }
h1 em { font-style: italic; color: var(--accent); padding: 0 0.04em; transition: color 0.5s ease; }
.timer-row { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); padding-inline: max(16px, env(safe-area-inset-left, 0px)); display: flex; justify-content: center; align-items: baseline; gap: clamp(0.8rem, 2vw, 1.8rem); }
.lead {
  flex: none;
  margin: 0;
  font-family: var(--font-display);
  font-style: italic;
  font-size: clamp(1.5rem, 3.6vw, 3.1rem);
  line-height: 1;
  color: var(--hero-fg);
  text-shadow: 0 2px 20px rgba(0, 0, 0, 0.4);
}
.timer {
  display: grid;
  grid-template-columns: repeat(6, minmax(0, 1fr));
  gap: clamp(0.5rem, 2vw, 1.6rem);
  flex: 1 1 auto;
  min-width: 0;
  max-width: 40rem;
  margin: 0;
  padding: 0;
}
.unit { min-width: 0; text-align: center; border-top: 1px solid rgba(248, 246, 240, 0.5); padding-top: 0.55rem; text-shadow: 0 1px 16px rgba(0, 0, 0, 0.4); }
.num {
  display: block;
  font-weight: 300;
  font-size: clamp(1.7rem, 6.4vw, 4rem);
  line-height: 1;
  letter-spacing: -0.02em;
  font-variant-numeric: tabular-nums;
  color: var(--accent);
  transition: color 0.5s ease;
}
.lab {
  display: block;
  margin-top: 0.4rem;
  font-weight: 600;
  font-size: clamp(0.55rem, 1.9vw, 0.72rem);
  line-height: 1.2;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--hero-muted);
}

.total { display: grid; justify-items: center; flex: 1 1 auto; min-width: 0; max-width: 40rem; margin: 0; padding: 0; }
.total .num { white-space: nowrap; }
.total .unit { padding-inline: 1.4rem; }
.menu {
  position: absolute;
  left: max(16px, env(safe-area-inset-left, 0px), calc((100% - 1200px) / 2 + 16px));
  bottom: calc(5% + 0.5rem);
}
.menu::before {
  content: "";
  position: absolute;
  inset: -1.6rem -3.5rem -1.2rem -3rem;
  z-index: 1;
  background: radial-gradient(closest-side, rgba(6, 16, 10, 0.58), rgba(6, 16, 10, 0));
  pointer-events: none;
}
.modes { position: relative; z-index: 4; display: flex; flex-direction: column; align-items: flex-start; gap: 0; margin: 0; }
.mode {
  min-height: 34px;
  padding: 0.25rem 0 0.25rem 0.85rem;
  border: 0;
  border-left: 1px solid rgba(248, 246, 240, 0.3);
  background: none;
  color: var(--hero-muted);
  font-family: var(--font-body);
  font-size: 0.9rem;
  font-weight: 500;
  letter-spacing: 0.02em;
  text-align: left;
  text-shadow: 0 1px 14px rgba(0, 0, 0, 0.55);
  opacity: 0.88;
  cursor: pointer;
  transition: color 0.2s ease, opacity 0.2s ease, border-color 0.2s ease;
}
.timer-row.long .lead { font-size: clamp(1.4rem, 2.6vw, 2.4rem); }
@media (max-width: 760px) { .timer-row.long .lead { font-size: clamp(1.35rem, 5.4vw, 1.7rem); } }
.lead-b { display: inline-grid; text-align: left; }
.lead-b .w { grid-area: 1 / 1; }
.lead-b .w:not(.on) { visibility: hidden; }
@media (max-width: 760px) { .lead-b { text-align: center; } }
.views {
  position: absolute;
  right: max(16px, env(safe-area-inset-right, 0px), calc((100% - 1200px) / 2 + 16px));
  bottom: calc(5% + 0.5rem);
}
.views::before {
  content: "";
  position: absolute;
  inset: -1.6rem -0.9rem -1.2rem -2.4rem;
  z-index: 1;
  background: radial-gradient(closest-side, rgba(6, 16, 10, 0.58), rgba(6, 16, 10, 0));
  pointer-events: none;
}
.view-btns { position: relative; z-index: 4; display: flex; gap: 0.6rem; }
.view {
  width: 46px; height: 46px; padding: 0;
  display: grid; place-items: center;
  border: 1px solid rgba(248, 246, 240, 0.3);
  border-radius: 50%;
  background: rgba(8, 18, 12, 0.18);
  color: var(--hero-muted);
  opacity: 0.88;
  cursor: pointer;
  filter: drop-shadow(0 1px 10px rgba(0, 0, 0, 0.5));
  transition: color 0.2s ease, opacity 0.2s ease, border-color 0.2s ease, background 0.2s ease;
}
.view svg { width: 26px; height: 26px; display: block; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
.view:hover { opacity: 1; color: var(--hero-fg); border-color: rgba(248, 246, 240, 0.7); }
.view:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.view[aria-pressed="true"] { opacity: 1; color: var(--accent); border-color: var(--accent); background: rgba(8, 18, 12, 0.32); }
.mode:hover { opacity: 1; color: var(--hero-fg); border-left-color: rgba(248, 246, 240, 0.8); }
.mode:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mode[aria-pressed="true"] { opacity: 1; color: var(--accent); border-left-color: var(--accent); }

.rise { animation: rise 1.1s cubic-bezier(0.2, 0.7, 0.2, 1) both; }
.rise.d1 { animation-delay: 0.12s; }
.rise.d2 { animation-delay: 0.24s; }
.rise.d3 { animation-delay: 0.36s; }
.rise.d4 { animation-delay: 0.48s; }
/* Opbouw bij het openen: eerst de foto, dan de titel, dan de teller, dan de keuzes */
.photo, .couple { opacity: 0; transition: opacity 2.2s ease; }
.hero.ready .photo, .hero.ready .couple { opacity: 1; }
.stage { opacity: 0; }
.hero.ready .stage { animation: stagein 1.9s cubic-bezier(0.25, 0.46, 0.45, 0.94) both; }
.hero.ready .timer-row.stage { animation-name: fadein; }
.hero.ready .s1 { animation-delay: 1.7s; }
.hero.ready .s2 { animation-delay: 3.4s; }
.hero.ready .s3 { animation-delay: 5s; }
@keyframes stagein { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
@keyframes rise { from { opacity: 0.35; transform: translateY(12px); } to { opacity: 1; transform: none; } }


@media (max-width: 760px) {
  .timer-row { flex-direction: column; align-items: center; gap: 0.8rem; }
  .timer-row .timer, .timer-row .total { align-self: stretch; }
  .timer-row .lead { font-size: clamp(1.35rem, 5.4vw, 1.7rem); }
  .mode { min-height: 30px; font-size: 0.85rem; }
  .photo, .couple { object-position: 61% 82%; }
}
/* Als geïnstalleerde app: nooit scrollen, altijd precies het zichtbare scherm vullen */
html { overscroll-behavior: none; }
@media (display-mode: standalone), (display-mode: fullscreen), (display-mode: minimal-ui) {
  html, body { height: 100%; overflow: hidden; }
  .hero { height: 100dvh; min-height: 0; }
}
@media (prefers-reduced-motion: reduce) {
  .photo { animation: none; }
  .rise { animation: none; }
  .photo, .couple { opacity: 1; transition: none; }
  .hero .stage { opacity: 1; animation: none !important; }
  #motes { display: none; }
}
</style>

<main>
  <header class="hero" data-view="together">
    <img class="photo" src="foto.jpg" width="2576" height="1717" alt="Roy en Louise staan dicht tegen elkaar in een tuin vol hortensia's en kijken elkaar aan">
    <div class="shade"></div>
    <canvas id="motes" aria-hidden="true"></canvas>

    <div class="hero-inner wrap">
      <div class="title-block">
        <h1 class="stage s1">Roy <em>&amp;</em> Louise</h1>
        <div class="timer-row stage s2" id="row">
        <span class="lead" id="lead-a">al</span>
        <div class="timer" id="timer" role="timer" aria-label="Roy en Louise zijn al samen">
          <div class="unit"><span class="num" id="n-y">13</span><span class="lab" id="l-y">jaar</span></div>
          <div class="unit"><span class="num" id="n-m">02</span><span class="lab" id="l-m">maanden</span></div>
          <div class="unit"><span class="num" id="n-d">03</span><span class="lab" id="l-d">dagen</span></div>
          <div class="unit"><span class="num" id="n-h">00</span><span class="lab" id="l-h">uur</span></div>
          <div class="unit"><span class="num" id="n-i">00</span><span class="lab" id="l-i">minuten</span></div>
          <div class="unit"><span class="num" id="n-s">00</span><span class="lab" id="l-s">seconden</span></div>
        </div>
        <div class="total" id="total" hidden>
          <div class="unit"><span class="num" id="t-num">0</span><span class="lab" id="t-lab">dagen</span></div>
        </div>
        <span class="lead lead-b" id="lead-b"><span class="w on" id="w-s">samen...</span><span class="w" id="w-g">getrouwd...</span></span>
        </div>
      </div>
    </div>
    <img class="couple" src="couple.webp" width="2576" height="1717" alt="" aria-hidden="true">
    <div class="views">
      <div class="view-btns stage s3" role="group" aria-label="Kies wat de teller laat zien">
        <button class="view" type="button" data-view="together" aria-pressed="true" aria-label="Samen" title="Samen">
          <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 26.5C8.2 21 5 16.6 5 12.3 5 8.8 7.6 6.5 10.7 6.5 13.1 6.5 15 7.8 16 10 17 7.8 18.9 6.5 21.3 6.5 24.4 6.5 27 8.8 27 12.3 27 16.6 23.8 21 16 26.5Z"/></svg>
        </button>
        <button class="view" type="button" data-view="married" aria-pressed="false" aria-label="Getrouwd" title="Getrouwd">
          <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="11.5" cy="19.5" r="6.2"/><circle cx="20.5" cy="19.5" r="6.2"/><path d="M20.5 13.3 18.6 10.4 20.5 7.4 22.4 10.4Z"/><path d="M18.6 10.4H22.4"/></svg>
        </button>
      </div>
    </div>
    <div class="menu">
      <div class="modes stage s3" role="group" aria-label="Toon de tijd in totaal">
        <button class="mode" type="button" data-mode="years" aria-pressed="false">jaren</button>
        <button class="mode" type="button" data-mode="months" aria-pressed="false">maanden</button>
        <button class="mode" type="button" data-mode="weeks" aria-pressed="false">weken</button>
        <button class="mode" type="button" data-mode="days" aria-pressed="false">dagen</button>
        <button class="mode" type="button" data-mode="hours" aria-pressed="false">uren</button>
        <button class="mode" type="button" data-mode="minutes" aria-pressed="false">minuten</button>
        <button class="mode" type="button" data-mode="seconds" aria-pressed="false">seconden</button>
      </div>
    </div>
  </header>


</main>


<script>
(function () {
  'use strict';
  var DAY = 864e5, HOUR = 36e5;
  var START = Date.UTC(2013, 7, 12, 20, 0, 0); // 12 augustus 2013, 20:00 Nederlandse tijd (als wandkloktijd)

  /* ---- Nederlandse wandkloktijd: kalenderrekening zonder zomertijd-sprongen ---- */
  var amsFmt = null;
  try {
    amsFmt = new Intl.DateTimeFormat('en-GB', {
      timeZone: 'Europe/Amsterdam', year: 'numeric', month: 'numeric', day: 'numeric',
      hour: 'numeric', minute: 'numeric', second: 'numeric', hourCycle: 'h23'
    });
  } catch (e) { amsFmt = null; }

  function wallNow() {
    var now = new Date();
    if (!amsFmt) {
      return Date.UTC(now.getFullYear(), now.getMonth(), now.getDate(), now.getHours(), now.getMinutes(), now.getSeconds());
    }
    var o = {};
    amsFmt.formatToParts(now).forEach(function (p) { if (p.type !== 'literal') o[p.type] = parseInt(p.value, 10); });
    return Date.UTC(o.year, o.month - 1, o.day, o.hour % 24, o.minute, o.second);
  }

  function addMonths(ms, m) {
    var d = new Date(ms);
    var day = d.getUTCDate();
    var t = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + m, 1, d.getUTCHours(), d.getUTCMinutes(), d.getUTCSeconds()));
    var dim = new Date(Date.UTC(t.getUTCFullYear(), t.getUTCMonth() + 1, 0)).getUTCDate();
    t.setUTCDate(Math.min(day, dim));
    return t.getTime();
  }

  function breakdown(startMs, nowMs) {
    var s = new Date(startMs), n = new Date(nowMs);
    var months = (n.getUTCFullYear() - s.getUTCFullYear()) * 12 + (n.getUTCMonth() - s.getUTCMonth());
    while (months > 0 && addMonths(startMs, months) > nowMs) months--;
    var rem = nowMs - addMonths(startMs, months);
    var days = Math.floor(rem / DAY); rem -= days * DAY;
    var hours = Math.floor(rem / HOUR); rem -= hours * HOUR;
    var mins = Math.floor(rem / 6e4); rem -= mins * 6e4;
    var secs = Math.floor(rem / 1000);
    return { years: Math.floor(months / 12), months: months % 12, days: days, hours: hours, mins: mins, secs: secs };
  }

  var nf = new Intl.NumberFormat('nl-NL');
  var dateFmt = new Intl.DateTimeFormat('nl-NL', { timeZone: 'UTC', day: 'numeric', month: 'long', year: 'numeric' });
  function pad(n) { return n < 10 ? '0' + n : String(n); }
  function el(id) { return document.getElementById(id); }
  function plural(n, one, many) { return n === 1 ? one : many; }

  /* ---- Teller ---- */
  var WEDDING = Date.UTC(2017, 6, 21, 14, 0, 0);
  var view = 'together';
  var cache = {};
  var mode = null;
  var MODES = {
    years:   { div: 0,       one: 'jaar',   many: 'jaren' },
    months:  { div: 0,       one: 'maand',  many: 'maanden' },
    days:    { div: DAY,     one: 'dag',    many: 'dagen' },
    weeks:   { div: 7 * DAY, one: 'week',   many: 'weken' },
    hours:   { div: HOUR,    one: 'uur',    many: 'uren' },
    minutes: { div: 6e4,     one: 'minuut', many: 'minuten' },
    seconds: { div: 1000,    one: 'seconde', many: 'seconden' }
  };
  function setText(id, v) { if (cache[id] !== v) { cache[id] = v; el(id).textContent = v; } }

  function updateTimer(now) {
    var ref = view === 'married' ? WEDDING : START;
    var before = now < ref;
    var b = before ? breakdown(now, ref) : breakdown(ref, now);
    var elapsed = Math.abs(now - ref);
    el('row').classList.toggle('long', view === 'married' && before);
    setText('lead-a', before ? 'Nog' : 'al');
    if (cache.view !== view) {
      cache.view = view;
      document.querySelector('.hero').setAttribute('data-view', view);
      el('w-s').classList.toggle('on', view !== 'married');
      el('w-g').classList.toggle('on', view === 'married');
    }
    setText('n-y', String(b.years));
    setText('n-m', pad(b.months));
    setText('n-d', pad(b.days));
    setText('n-h', pad(b.hours));
    setText('n-i', pad(b.mins));
    setText('n-s', pad(b.secs));
    setText('l-y', 'jaar');
    setText('l-m', plural(b.months, 'maand', 'maanden'));
    setText('l-d', plural(b.days, 'dag', 'dagen'));
    setText('l-h', 'uur');
    setText('l-i', plural(b.mins, 'minuut', 'minuten'));
    setText('l-s', plural(b.secs, 'seconde', 'seconden'));
    var akey = view + (before ? 'b' : 'a');
    if (b.secs === 0 || cache.aria !== akey) {
      cache.aria = akey;
      el('timer').setAttribute('aria-label',
        'Roy en Louise ' + (before ? 'zijn nog ' : 'zijn al ') + b.years + ' jaar, ' + b.months + ' ' + plural(b.months, 'maand', 'maanden') + ', ' +
        b.days + ' ' + plural(b.days, 'dag', 'dagen') + ', ' + b.hours + ' uur en ' + b.mins + ' ' + plural(b.mins, 'minuut', 'minuten') + (view === 'married' ? (before ? ' tot hun huwelijk' : ' getrouwd') : ' samen'));
    }
    if (mode) {
      var m = MODES[mode];
      var v = mode === 'years' ? b.years : mode === 'months' ? b.years * 12 + b.months : Math.floor(elapsed / m.div);
      setText('t-num', nf.format(v));
      setText('t-lab', v === 1 ? m.one : m.many);
    }
  }

  var modeBtns = document.querySelectorAll('.mode');
  function applyMode() {
    el('timer').hidden = !!mode;
    el('total').hidden = !mode;
    Array.prototype.forEach.call(modeBtns, function (b) {
      b.setAttribute('aria-pressed', b.getAttribute('data-mode') === mode ? 'true' : 'false');
    });
    updateTimer(wallNow());
  }
  Array.prototype.forEach.call(modeBtns, function (b) {
    b.addEventListener('click', function () {
      var key = b.getAttribute('data-mode');
      mode = (mode === key) ? null : key;
      applyMode();
    });
  });
  document.addEventListener('click', function (e) {
    if (mode && !(e.target.closest && e.target.closest('.mode, .view'))) { mode = null; applyMode(); }
  });
  /* Pas als de foto er is, beginnen de titel, de teller en de keuzes aan hun opbouw */
  (function () {
    var hero = document.querySelector('.hero');
    var imgs = Array.prototype.slice.call(hero.querySelectorAll('img.photo, img.couple'));
    var started = false;
    function go() { if (started) return; started = true; hero.classList.add('ready'); }
    function check() {
      for (var i = 0; i < imgs.length; i++) if (!(imgs[i].complete && imgs[i].naturalWidth)) return;
      go();
    }
    imgs.forEach(function (im) { im.addEventListener('load', check); im.addEventListener('error', go); });
    check();
    setTimeout(go, 6000);
  })();
  var viewBtns = document.querySelectorAll('.view');
  Array.prototype.forEach.call(viewBtns, function (b) {
    b.addEventListener('click', function () {
      view = b.getAttribute('data-view');
      Array.prototype.forEach.call(viewBtns, function (x) {
        x.setAttribute('aria-pressed', x === b ? 'true' : 'false');
      });
      updateTimer(wallNow());
    });
  });
  function tick() { updateTimer(wallNow()); }
  tick();
  setInterval(tick, 250);

  /* ---- Zachte lichtdeeltjes in de hero ---- */
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var cv = el('motes');
  if (cv && cv.getContext && !reduce) {
    var ctx = cv.getContext('2d'), W = 0, H = 0, P = [], last = 0, running = false;
    var resize = function () {
      var r = cv.getBoundingClientRect(), dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = r.width; H = r.height;
      cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      var n = W < 600 ? 39 : 69;
      P = [];
      for (var i = 0; i < n; i++) {
        P.push({ x: Math.random() * W, y: Math.random() * H, r: 0.9 + Math.random() * 2.1, v: 7 + Math.random() * 12, ph: Math.random() * 6.28, a: 0.3 + Math.random() * 0.45 });
      }
    };
    var frame = function (t) {
      if (!running) return;
      var dt = Math.min(0.05, (t - last) / 1000 || 0.016); last = t;
      ctx.clearRect(0, 0, W, H);
      for (var i = 0; i < P.length; i++) {
        var p = P[i];
        p.y -= p.v * dt;
        p.x += Math.sin(t / 2600 + p.ph) * 0.12;
        if (p.y < -6) { p.y = H + 6; p.x = Math.random() * W; }
        var a = p.a * (0.6 + 0.4 * Math.sin(t / 1700 + p.ph));
        ctx.beginPath(); ctx.fillStyle = 'rgba(255,238,200,' + (a * 0.3).toFixed(3) + ')'; ctx.arc(p.x, p.y, p.r * 3.6, 0, 6.2832); ctx.fill();
        ctx.beginPath(); ctx.fillStyle = 'rgba(255,246,222,' + a.toFixed(3) + ')'; ctx.arc(p.x, p.y, p.r, 0, 6.2832); ctx.fill();
      }
      requestAnimationFrame(frame);
    };
    var start = function () { if (!running) { running = true; requestAnimationFrame(frame); } };
    resize();
    window.addEventListener('resize', resize);
    document.addEventListener('visibilitychange', function () { if (document.hidden) running = false; else start(); });
    start();
  }
})();

  /* Teller precies tussen de titel en Roys hoofd */
  (function () {
    var hero = document.querySelector('.hero'), h1 = document.querySelector('h1'), row = document.getElementById('row');
    if (!hero || !h1 || !row) return;
    var IMG_W = 2000, IMG_H = 1333, HEAD_Y = 643, POS_Y = 0.82, ORIGIN_Y = 0.8, DRIFT = 1.025;
    function place() {
      var W = hero.clientWidth, H = hero.clientHeight;
      var s = Math.max(W / IMG_W, H / IMG_H);
      var y = (H - IMG_H * s) * POS_Y + HEAD_Y * s;
      var oy = H * ORIGIN_Y;
      y = oy + (y - oy) * DRIFT;
      var top = h1.offsetTop + h1.offsetHeight;
      var mid = (top + y) / 2;
      row.style.top = Math.round(mid) + 'px';
    }
    place();
    window.addEventListener('resize', place);
    window.addEventListener('orientationchange', place);
    if (window.visualViewport) window.visualViewport.addEventListener('resize', place);
    window.addEventListener('load', place);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(place);
    if (window.ResizeObserver) new ResizeObserver(place).observe(h1);
  })();
</script>
